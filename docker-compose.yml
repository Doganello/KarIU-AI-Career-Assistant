version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: kariu_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A app.celery_app worker --beat --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
      - db

  bot:
    build: .
    command: python -m telegram_bot.bot
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - app

volumes:
  postgres_data: